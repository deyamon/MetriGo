<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MetriGo — Reset Password</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="api.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#0A0F1E;--ink-soft:#3D4460;--ink-muted:#8B93B0;--surface:#F5F6FA;--white:#FFF;--accent:#1A56DB;--border:rgba(10,15,30,.10);--success:#0D9970;--danger:#D93025}
body{min-height:100vh;font-family:'DM Sans',sans-serif;background:var(--ink);display:grid;place-items:center;overflow-x:hidden}
.bg{position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 15% 100%,rgba(26,86,219,.22),transparent 60%),radial-gradient(ellipse 60% 50% at 90% 10%,rgba(75,123,245,.14),transparent 55%),linear-gradient(160deg,#0A0F1E 0%,#111829 50%,#0D1526 100%)}
.card{position:relative;z-index:1;width:min(460px,calc(100% - 40px));background:var(--white);padding:52px;border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.28)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:42px}.brand-icon{width:40px;height:40px;background:var(--accent);border-radius:10px;display:grid;place-items:center}.brand-icon svg{width:22px;height:22px;fill:white}.brand-name{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--ink)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--accent);margin-bottom:12px}.title{font-family:'Syne',sans-serif;font-size:30px;color:var(--ink);margin-bottom:8px}.sub{font-size:14px;color:var(--ink-muted);line-height:1.6;margin-bottom:32px}
.group{margin-bottom:20px}.label{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);margin-bottom:8px}.input{width:100%;height:50px;padding:0 15px;border:1.5px solid var(--border);border-radius:12px;background:var(--surface);font:14px 'DM Sans',sans-serif;color:var(--ink);outline:none;transition:.2s}.input:focus{border-color:var(--accent);background:white;box-shadow:0 0 0 4px rgba(26,86,219,.08)}
.btn{width:100%;height:52px;border:0;border-radius:12px;background:var(--accent);color:white;font:500 15px 'DM Sans',sans-serif;cursor:pointer;transition:.2s}.btn:hover{background:#1347C0;box-shadow:0 8px 24px rgba(26,86,219,.35);transform:translateY(-1px)}
#message{display:none;margin-top:16px;font-size:13px;border-radius:10px;padding:10px 14px;font-weight:500}#message.error{display:block;background:#FEF1F1;color:var(--danger);border:1px solid rgba(217,48,37,.15)}#message.success{display:block;background:#F0FBF6;color:var(--success);border:1px solid rgba(13,153,112,.15)}
.back{text-align:center;margin-top:24px;font-size:13px}.back a{color:var(--accent);text-decoration:none}.back a:hover{opacity:.7}
@media(max-width:520px){.card{padding:36px 28px}}


/* ===== MetriGo Responsive UI Polish ===== */
html { scroll-behavior: smooth; }
body { overflow-x: hidden; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button, a { touch-action: manipulation; }

@media (max-width: 900px) {
  .navbar {
    height: auto !important;
    min-height: 64px;
    padding: 10px 20px !important;
    flex-wrap: wrap;
    row-gap: 8px;
  }
  .nav-brand { min-height: 40px; }
  .nav-right { margin-left: auto; }
  .nav-profile span { max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-links {
    display: flex !important;
    order: 3;
    width: 100%;
    margin-left: 0 !important;
    gap: 4px;
    overflow-x: auto;
    overflow-y: hidden;
    padding: 2px 0 4px;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  .nav-links::-webkit-scrollbar { display: none; }
  .nav-links a { flex: 0 0 auto; padding: 8px 12px; font-size: 12px; }
  .nav-profile-btn, .nav-profile { min-height: 40px; }
}

@media (max-width: 600px) {
  .nav-logo-text { font-size: 17px; }
  .nav-profile { padding-right: 8px; }
  .nav-profile span { display: none; }
  .nav-profile-btn { padding-right: 8px; }
  .hero, .page-header { padding-left: 20px !important; padding-right: 20px !important; }
  .page-header h1 { font-size: clamp(28px, 8vw, 34px); }
  .main { padding-left: 16px !important; padding-right: 16px !important; }
  .toast { left: 16px; right: 16px; bottom: 16px; max-width: none; }
}

@media (max-width: 380px) {
  .navbar { padding-left: 14px !important; padding-right: 14px !important; }
  .nav-links a { padding-left: 10px; padding-right: 10px; }
}

/* Accessible, consistent focus treatment */
:focus-visible { outline: 3px solid rgba(26,86,219,.28); outline-offset: 2px; }


@media (max-width: 600px) {
  .card { width: min(460px, calc(100% - 28px)); padding: 34px 22px; border-radius: 18px; }
  .brand { margin-bottom: 32px; }
  .title { font-size: 27px; }
}
@media (max-width: 380px) {
  .card { width: calc(100% - 20px); padding: 28px 18px; }
}

</style>
</head>
<body>
<div class="bg"></div>
<main class="card">
  <div class="brand"><div class="brand-icon"><svg viewBox="0 0 24 24"><path d="M2 20h20v-2H2v2zm2-3h16v-2H4v2zM12 3L2 9h20L12 3zm-4 7h8v7H8v-7z"/></svg></div><span class="brand-name">MetriGo</span></div>
  <p class="eyebrow">Account recovery</p>
  <h1 class="title">Set a new password</h1>
  <p class="sub">Choose a new password for your MetriGo account. This reset link expires after 15 minutes.</p>
  <form onsubmit="resetPassword(event)">
    <div class="group"><label class="label" for="password">New password</label><input class="input" id="password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"></div>
    <div class="group"><label class="label" for="confirm">Confirm password</label><input class="input" id="confirm" type="password" minlength="8" required autocomplete="new-password" placeholder="Enter it again"></div>
    <button class="btn" type="submit">Reset Password</button>
    <div id="message"></div>
  </form>
  <div class="back"><a href="login.html">← Back to sign in</a></div>
</main>
<script>
const token = new URLSearchParams(window.location.search).get('token');
const message = document.getElementById('message');
function showMessage(text,type){message.textContent=text;message.className=type;message.style.display='block'}
function resetPassword(event){
  event.preventDefault();
  const password=document.getElementById('password').value;
  const confirm=document.getElementById('confirm').value;
  if(!token){showMessage('This reset link is missing or invalid.','error');return}
  if(password.length<8){showMessage('Password must be at least 8 characters.','error');return}
  if(password!==confirm){showMessage('Passwords do not match.','error');return}
  apiFetch('/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:password})})
    .then(r=>r.json())
    .then(data=>{
      if(data.success){showMessage('Password reset successful. Redirecting to sign in…','success');setTimeout(()=>window.location.href='login.html',900)}
      else showMessage(data.message||'Password reset failed.','error');
    })
    .catch(()=>showMessage('Server error. Please try again.','error'));
}
</script>
</body>
</html>
